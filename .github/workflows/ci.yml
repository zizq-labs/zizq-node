name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Publishing lives in `release.yml`, so nothing here writes to the repo.
permissions:
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19", "24", "25.9", "latest"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Node version
        run: node --version

      - name: Test
        run: npm test

  package:
    name: Package
    needs: typecheck
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm

      - name: Read version
        id: version
        run: echo "version=$(node -e 'process.stdout.write(require("./package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        run: ./release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zizq-node-package
          path: |
            target/release/zizq-*.tgz
            target/release/zizq-*.tgz.sha256

  integration:
    name: Integration
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: client

      - name: Read client version
        id: client-version
        working-directory: client
        run: |
          version=$(node -e 'process.stdout.write(require("./package.json").version)')
          major=${version%%.*}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major=${major}" >> "$GITHUB_OUTPUT"

      - name: Find and download latest compatible server build
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          client/.github/scripts/find-server-build.sh \
            ${{ steps.client-version.outputs.major }} \
            server

      - name: Download client artifact
        uses: actions/download-artifact@v8
        with:
          name: zizq-node-package
          path: artifact

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Run integration tests
        working-directory: client
        env:
          ZIZQ_LICENSE_KEY: ${{ secrets.ZIZQ_LICENSE_KEY }}
        run: |
          ARGS=(--binary ${{ github.workspace }}/server/zizq --tarball ${{ github.workspace }}/artifact/zizq-*.tgz)
          if [[ -n "$ZIZQ_LICENSE_KEY" ]]; then
            ARGS+=(--license-key "$ZIZQ_LICENSE_KEY")
          fi
          ./integration/run.sh "${ARGS[@]}"

  examples:
    name: Examples (${{ matrix.example }})
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - audit_log
          - uptime_monitor
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/${{ matrix.example }}/package-lock.json

      # Install the client's runtime deps first — the example
      # links to `../..` via a `file:` dep, so `import "@zizq-labs/zizq"`
      # from the example resolves through that symlink into the
      # client's own `node_modules` (undici, @msgpack/msgpack).
      - name: Install client
        run: npm ci

      - name: Install example
        working-directory: examples/${{ matrix.example }}
        run: npm ci

      - name: Type check
        working-directory: examples/${{ matrix.example }}
        run: npx tsc --noEmit

      - name: Test
        working-directory: examples/${{ matrix.example }}
        run: npm test

  # --- Gate (stable check name for branch protection) ---

  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [test, integration, examples]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ] || \
             [ "${{ needs.examples.result }}" != "success" ]; then
            echo "Required checks failed or were skipped."
            echo "  Test: ${{ needs.test.result }}"
            echo "  Integration: ${{ needs.integration.result }}"
            echo "  Examples: ${{ needs.examples.result }}"
            exit 1
          fi
