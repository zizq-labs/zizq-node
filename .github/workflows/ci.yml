name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19", "24", "25.9", "latest"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Node version
        run: node --version

      - name: Test
        run: npm test

  package:
    name: Package
    needs: typecheck
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest
          cache: npm

      - name: Read version
        id: version
        run: echo "version=$(node -e 'process.stdout.write(require("./package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        run: ./release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zizq-node-package
          path: |
            target/release/zizq-*.tgz
            target/release/zizq-*.tgz.sha256

  integration:
    name: Integration
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: client

      - name: Read client version
        id: client-version
        working-directory: client
        run: |
          version=$(node -e 'process.stdout.write(require("./package.json").version)')
          major=${version%%.*}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major=${major}" >> "$GITHUB_OUTPUT"

      - name: Find and download latest compatible server build
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          client/.github/scripts/find-server-build.sh \
            ${{ steps.client-version.outputs.major }} \
            server

      - name: Download client artifact
        uses: actions/download-artifact@v7
        with:
          name: zizq-node-package
          path: artifact

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest

      - name: Run integration tests
        working-directory: client
        env:
          ZIZQ_LICENSE_KEY: ${{ secrets.ZIZQ_LICENSE_KEY }}
        run: |
          ARGS=(--binary ${{ github.workspace }}/server/zizq --tarball ${{ github.workspace }}/artifact/zizq-*.tgz)
          if [[ -n "$ZIZQ_LICENSE_KEY" ]]; then
            ARGS+=(--license-key "$ZIZQ_LICENSE_KEY")
          fi
          ./integration/run.sh "${ARGS[@]}"

  # --- Gate (stable check name for branch protection) ---

  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ]; then
            echo "Required checks failed or were skipped."
            echo "  Test: ${{ needs.test.result }}"
            echo "  Integration: ${{ needs.integration.result }}"
            exit 1
          fi

  # --- Publish GitHub Release (main only, requires approval) ---

  publish:
    name: Publish Release
    needs: [gate, package]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download package artifact
        uses: actions/download-artifact@v7
        with:
          name: zizq-node-package
          path: artifacts

      - name: Extract release notes from CHANGELOG
        run: |
          version=${{ needs.package.outputs.version }}
          sed -n "/^## ${version}/,/^## /p" CHANGELOG.md | head -n -1 | tail -n +2 > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ needs.package.outputs.version }}
          gh release create "v${version}" \
            --title "v${version}" \
            --notes-file release-notes.md \
            artifacts/zizq-*

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=${{ needs.package.outputs.version }}
          npm publish "./artifacts/zizq-${version}.tgz" --access public
