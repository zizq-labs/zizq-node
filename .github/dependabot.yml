# Dependabot version updates for the Node client.
# Security advisories + Dependabot alerts are configured separately
# in Settings → Code security and analysis.
#
# Strategy: weekly grouped patch+minor PRs, `versioning-strategy:
# lockfile-only` so package.json constraints don't get auto-bumped —
# only package-lock.json moves, keeping dev/CI on the latest resolved
# versions. Public-facing `dependencies` stays stable for npm consumers.
# npm's caret specifiers already accept future patch/minor releases
# through the lockfile alone.
#
# Note: Dependabot doesn't support per-dependency-type versioning
# strategy in a single npm entry. Security advisories override this
# and PR regardless via Dependabot security updates.
#
# The example apps under `examples/` have their own lockfiles and
# are NOT covered by the root entry, so `/examples/*` matches them
# all. This is a glob deliberately: a directory missing from the
# list is invisible to version updates *and* to the automatic PRs
# that fix a security advisory, so an alert gets raised and then
# never patched. Adding an example should not require remembering
# to edit this file.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      # Every example app with its own manifest.
      - "/examples/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    versioning-strategy: "lockfile-only"
    groups:
      npm-patch-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    groups:
      actions-patch-minor:
        update-types:
          - "patch"
          - "minor"
